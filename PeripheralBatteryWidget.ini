; Skin-wide settings: refresh speed, transparency, and the helper startup action.
[Rainmeter]
Update=#RainmeterUpdateMilliseconds#
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

OnRefreshAction=[!CommandMeasure "MeasureHeadsetBridge" "Run"]

; Name and description shown for this layout in Rainmeter.
[Metadata]
Name=Peripheral Battery Widget (2x2)
Author=Codex
Information=Up to four supported Logitech wireless battery devices in a 2x2 grid.
Version=2.0

; Layout selection and shared files that define timing values and text styles.
[Variables]
Layout=2x2
@Include=#@#Settings.inc
@Include2=#@#Styles.inc


; Starts the Rust helper once when the skin refreshes; it keeps running in the background.
[MeasureHeadsetBridge]
Measure=Plugin
Plugin=RunCommand
Program=""#@#headset-battery-bridge-rs.exe""
State=Hide
Timeout=-1
UpdateDivider=-1

; Runs Grid.lua to read the helper snapshot and update the cards.
[MeasureGrid]
Measure=Script
ScriptFile=#@#Grid.lua
UpdateDivider=1

; Starting value for the card ring gauge; Grid.lua changes it when a reading arrives.
[MeasureLevel1]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Starting value for the card ring gauge; Grid.lua changes it when a reading arrives.
[MeasureLevel2]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Starting value for the card ring gauge; Grid.lua changes it when a reading arrives.
[MeasureLevel3]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Starting value for the card ring gauge; Grid.lua changes it when a reading arrives.
[MeasureLevel4]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Rounded panel behind the cards; its size is adjusted by Grid.lua for each layout.
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,324,216,12 | Fill LinearGradient PanelGradient | StrokeWidth 1 | Stroke LinearGradient PanelEdge
Shape2=Rectangle 1,1,322,214,11 | Fill LinearGradient PanelSheen | StrokeWidth 0
Shape3=Rectangle 10,1,304,1,1 | Fill LinearGradient PanelGlint | StrokeWidth 0
PanelGradient=270 | 0,0,0,150 ; 0.0 | 0,0,0,80 ; 0.5 | 0,0,0,20 ; 1.0
PanelEdge=0 | 185,211,241,145 ; 0.0 | 87,112,145,90 ; 0.5 | 180,205,238,125 ; 1.0
PanelSheen=270 | 255,255,255,24 ; 0.0 | 255,255,255,2 ; 0.35 | 0,0,0,0 ; 0.55 | 0,0,0,32 ; 1.0
PanelGlint=0 | 255,255,255,0 ; 0.0 | 255,255,255,42 ; 0.25 | 255,255,255,42 ; 0.75 | 255,255,255,0 ; 1.0

; Message shown while the helper has not reported any devices.
[MeterEmpty]
Meter=String
X=162
Y=108
W=300
H=42
FontFace=Segoe UI Semibold
FontSize=10
FontColor=190,198,211
StringAlign=CenterCenter
AntiAlias=1
Text=Waiting for Logitech battery devices...
Hidden=1

; Card 1: Card background with its gradient, edge, and highlight.
[Tile1]
Meter=Shape
X=8
Y=8
Shape=Rectangle 0,0,150,96,10 | Fill LinearGradient TileGradient | StrokeWidth 1 | Stroke LinearGradient TileEdge
Shape2=Rectangle 1,1,148,48,9 | Fill LinearGradient TileSheen | StrokeWidth 0
Shape3=Rectangle 8,2,134,1,1 | Fill Color 235,244,255,32 | StrokeWidth 0
TileGradient=270 | 0,0,0,125 ; 0.0 | 0,0,0,70 ; 0.5 | 0,0,0,25 ; 1.0
TileEdge=0 | 195,218,245,105 ; 0.0 | 120,150,190,70 ; 0.5 | 195,218,245,90 ; 1.0
TileSheen=270 | 255,255,255,22 ; 0.0 | 255,255,255,4 ; 1.0
Hidden=1
; Card 1: Rounded clipping shape that keeps the decorative images inside the card.
[TileMask1]
Meter=Shape
X=8
Y=8
W=150
H=96
Shape=Rectangle 0,0,150,96,10 | Fill Color 255,255,255,255 | StrokeWidth 0

; Card 1: Reflection image placed inside the rounded clipping shape.
[Reflect1]
Meter=Image
ImageName=#@#Images\ReflectRSS.png
Container=TileMask1
X=0
Y=0
W=150
H=96
ImageTint=255,255,255,210
Hidden=1

; Card 1: Shine image placed inside the rounded clipping shape.
[Shine1]
Meter=Image
ImageName=#@#Images\ShineH.png
Container=TileMask1
X=0
Y=0
W=150
H=96
ImageTint=255,255,255,65
Hidden=1

; Card 1: Dim full circle behind the battery level ring.
[RingTrack1]
Meter=Roundline
X=55
Y=18
W=56
H=56
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineStart=21
LineLength=27
Solid=1
LineColor=70,82,101,145
AntiAlias=1
Hidden=1
; Card 1: Roundline gauge used when the battery is at 100 percent.
[RingValue1]
Meter=Roundline
MeasureName=MeasureLevel1
X=55
Y=18
W=56
H=56
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineStart=21
LineLength=27
Solid=1
LineColor=82,211,113,225
AntiAlias=1
Hidden=1
; Card 1: Partial circle drawn by Lua for a battery level below 100 percent.
[RingArc1]
Meter=Shape
X=55
Y=18
W=56
H=56
Shape=Arc 28,4,28,4,24,24,0,0,1,0 | StrokeWidth 6 | Stroke Color 82,211,113,225 | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1
Hidden=1
; Card 1: Battery percentage text in the middle of the ring.
[Percent1]
Meter=String
MeterStyle=DevicePercent
X=83
Y=46
W=56
H=56
Text=--
Hidden=1
; Card 1: Device name displayed near the bottom of the card.
[Name1]
Meter=String
W=150
MeterStyle=DeviceName
X=83
Y=74
H=13
Text=
Hidden=1
